[package]
name = "page-composer"
version = "0.1.11"
description = "AOIN project page composer"
edition = "2021"
rust-version = "1.77"

[lib]
name = "page_composer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Self-update from the CMS host (see src/update.rs).
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

walkdir = "2"
base64 = "0.22"
image = "0.25"
webp = "0.3"
sha1 = "0.10"
hex = "0.4"
regex = "1"
anyhow = "1"
chrono = "0.4"
zip = "2"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "charset", "http2"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
