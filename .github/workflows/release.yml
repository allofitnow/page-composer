# Builds, signs and publishes the desktop app when a version tag is pushed.
#
#   npm run release patch      (or minor / major — bumps, tags, pushes)
#
# One GitHub release per tag, with the Windows installer, the macOS bundles,
# their updater signatures and latest.json — which installed apps poll via
# plugins.updater.endpoints in src-tauri/tauri.conf.json.
#
# Needs two repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           the contents of ~/.tauri/page-composer.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty for the key made 2026-09-10)
# A build signed with any other key is refused by every installed app.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          # Apple Silicon only: GitHub has retired its Intel Mac runners, and
          # the studio's Macs are all M-series. The app bundle is what the
          # updater installs; the dmg is for a first install by hand.
          - os: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.os }}
    steps:
      # Fail in the first second with a readable reason, not after a twelve
      # minute compile: the bundler refuses to sign without the private key.
      - name: Check the signing key is configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is not set. Add it under Settings → Secrets and variables → Actions, with the contents of ~/.tauri/page-composer.key, plus TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.os, 'macos') && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Node server's native deps (sharp) are not needed to build the
      # desktop app, but the tauri CLI is a devDependency, so install it all.
      - run: npm ci

      # ffmpeg and ffprobe ride inside the installer as sidecars; the static
      # packages npm just installed are the build for this runner's platform.
      - run: node scripts/fetch-ffmpeg.mjs ${{ matrix.args }}

      # Build once here with the log kept, so a failure can be READ from the
      # run's annotations without signing in. tauri-action then rebuilds from
      # the warm cargo cache in a minute and does the upload.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          npm run tauri build -- ${{ matrix.args }} 2>&1 | tee build.log

      - name: Report what failed
        if: failure()
        shell: bash
        run: |
          # GitHub keeps ten annotations per level, so only real error lines
          # (not crate names like thiserror) and a short tail.
          sed 's/\x1b\[[0-9;]*m//g' build.log > plain.log
          grep -E '(^|[^a-z_-])(error(\[E[0-9]+\])?:|Error:|failed to|panicked at|FAILED)' plain.log | grep -viE 'warning' | tail -8 | sed 's/^/::error::/' || true
          tail -8 plain.log | sed 's/^/::notice::/'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AOIN Page Composer ${{ github.ref_name }}'
          releaseBody: 'Installed apps offer this version from the top bar. New installs: the .exe on Windows, the .dmg on a Mac.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
